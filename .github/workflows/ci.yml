name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Verify tests and builds
        run: npm run verify
      - name: Audit npm dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Build portable executable
        run: npm run build:portable
      - name: Scan release privacy
        run: npm run scan:release

  audit-rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # notify-rust still pins tauri-winrt-notification 0.7.x. That crate only
          # uses quick-xml escaping, not the vulnerable parser APIs; see docs/security.md.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
