name: Build Apple packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-13
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: npm ci
      - name: Generate platform icons
        run: npx tauri icon assets/icon.svg --output src-tauri/icons
      - name: Build macOS app and disk image
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.macos.conf.json --ci
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/app/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  ios-simulator:
    name: iOS simulator (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Generate platform icons
        run: npx tauri icon assets/icon.svg --output src-tauri/icons
      - name: Initialize iOS project
        run: npx tauri ios init --ci
      - name: Build iOS simulator app
        run: npx tauri ios build --target aarch64-sim --export-method debugging
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-ios-simulator-arm64
          if-no-files-found: error
          path: |
            src-tauri/gen/apple/build/aarch64-sim/**/*.app
            src-tauri/gen/apple/build/aarch64-sim/**/*.ipa
