[package]
name = "taskflow-lite"
version = "0.2.1"
description = "小光任务 desktop app"
authors = ["小光任务"]
edition = "2021"

# Tauri mobile builds link the Rust entrypoint as a library. Desktop builds
# keep using the binary directly, so the large app module is not compiled and
# tested twice on Windows.
[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2.4.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17"
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
