[package]
name = "taskflow-lite"
version = "0.2.0"
description = "小光任务 desktop app"
authors = ["小光任务"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = ["dialog-all", "global-shortcut-all", "notification-all", "system-tray", "window-all"] }
uuid = { version = "1", features = ["v4", "serde"] }
rfd = "0.10"
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
